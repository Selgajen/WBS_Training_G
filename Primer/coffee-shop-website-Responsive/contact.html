
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Coffee Paradise</title>

        <!-- Connect external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Section -->
    <nav>
        <ul>
            <li><a href="index(Landing Page).html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main>

        <section>

            <h1>Contact Us</h1>

            <!-- Contact Information -->
            <div>
                <h2>Get in Touch</h2>

                <ul>
                    <li>Phone: +49 30 12345678</li>
                    <li>Email: hello@coffeeparadise.com</li>
                    <li>Address: Berlin, Germany</li>
                </ul>
            </div>

            <!-- Coffee Image -->
            <div>
                <img
                    src="https://images.pexels.com/photos/1002740/pexels-photo-1002740.jpeg"
                    alt="Freshly brewed coffee in a coffee shop"
                    width="100%">
            </div>

            <!-- Contact Form -->
            <div>
                <h2>Send Us a Message</h2>

                <form action="#" method="post">

                    <label for="name">Name:</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required>

                    <br><br>

                    <label for="email">Email:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                    <br><br>

                    <label for="message">Message:</label>
                    <br>

                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        cols="40"
                        placeholder="Write your message here..."
                        required></textarea>

                    <br><br>

                    <button type="submit">Send Message</button>

                </form>
            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Coffee Paradise. All rights reserved.</p>
    </footer>

</body>
</html>
